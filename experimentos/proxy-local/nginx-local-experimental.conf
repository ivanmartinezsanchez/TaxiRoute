# Únicamente para pruebas ficticias en localhost.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_header_timeout 5s;
  client_body_timeout 5s;
  server {
    listen 18771 ssl;
    ssl_certificate /cert/externo.pem;
    ssl_certificate_key /cert/externo.key;
    location / {
      proxy_pass https://127.0.0.1:18772;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /cert/interno.pem;
      proxy_ssl_name taxiroute-backend.local;
      proxy_set_header Host $http_host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header X-Forwarded-For "";
    }
  }
}
